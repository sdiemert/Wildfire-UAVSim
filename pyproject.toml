[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-uavsim"
version = "0.1.0"
description = "A customizable wildfire tracking simulator for evaluating UAV adaptation strategies"
readme = "README.md"
requires-python = ">=3.10"

# Kept in step with requirements.txt, which stays the documented install path for anyone following the
# README (`python3 -m pip install -r requirements.txt`). Installing this project is optional; see below.
#
# Mesa MUST stay on 1.x. Mesa 2.0 removed mesa.time and the tornado-based ModularServer /
# ModularVisualization used by the web interface, so newer versions fail at import.
dependencies = [
    "mesa==1.2.1",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

# The analysis under experiments/ only. The simulation imports none of these, so they stay out of the
# dependencies above and an install of the simulator does not drag scikit-learn in with it.
# requirements.txt lists them unconditionally, because it is the documented install path and someone
# following it is setting up to work on the whole repository.
analysis = ["scipy", "scikit-learn", "markdown"]

# only available after `pip install -e .`, which is optional: main.py and headless.py at the repository
# root do the same thing without one
[project.scripts]
wildfire-gui = "sim.gui.app:main"
wildfire-headless = "sim.cli.main:main"

[tool.setuptools]
# config.py deliberately lives at the repository root rather than inside the sim package: it is the file
# users actually edit, and burying it would make a newcomer hunt for the one thing they came to change.
# That makes it a top-level module, so an install has to carry it alongside the package.
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the project is run from its checkout rather than installed, so the repository root has to be importable
# from the tests: that is where config.py and the sim package live
pythonpath = ["."]
addopts = "-v"
# the verification leg of the requirement trace: a test carrying this marker is the evidence offered for
# the requirements it names. See specs/README.md; tests/test_traceability.py fails when a link breaks.
markers = [
    "verifies(*ids): requirement ids from specs/ that this test provides verification evidence for",
]
